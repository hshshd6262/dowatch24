<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050505" />
  <title>You're offline · Dowatch24</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
      color: #f5f5f5;
      background:
        radial-gradient(circle at 50% -10%, rgba(229, 9, 20, 0.22), transparent 45%),
        #050505;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }
    img { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 14px 34px rgba(229, 9, 20, 0.35); }
    h1 { margin-top: 22px; font-size: 1.5rem; font-weight: 800; }
    p { max-width: 300px; margin: 8px auto 0; color: #a5a5a5; font-size: 15px; line-height: 1.55; }
    button {
      margin-top: 24px;
      padding: 12px 26px;
      color: #fff;
      background: #e50914;
      border: 0;
      border-radius: 999px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="Dowatch24" />
    <h1>You're offline</h1>
    <p>Check your Wi-Fi or mobile data, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
  <script>addEventListener('online', () => location.reload())</script>
</body>
</html>
