    <!-- App loading screen: only inside the Android app / installed app, until the site is ready -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search)
          var inApp = q.has('app_v') || document.referrer.indexOf('android-app://') === 0 ||
            sessionStorage.getItem('dw_in_app') ||
            (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone
          if (!inApp) return
          document.documentElement.classList.add('dw-boot')
          // iPhone Home Screen app: use the whole screen (content clears the notch via CSS),
          // and start the loader from the launch picture (the D already in place)
          var ua = navigator.userAgent
          if (/iPad|iPhone|iPod/.test(ua) || (ua.indexOf('Macintosh') > -1 && navigator.maxTouchPoints > 1)) {
            document.documentElement.classList.add('dw-ios-app')
            var vp = document.querySelector('meta[name="viewport"]')
            if (vp && vp.content.indexOf('viewport-fit') < 0) vp.content += ', viewport-fit=cover'
          }
          var start = Date.now()
          var hide = function () {
            var el = document.getElementById('dw-boot')
            if (!el || el.dataset.out) return
            el.dataset.out = '1'
            setTimeout(function () {
              el.classList.add('dw-boot-out')
              setTimeout(function () { el.remove(); document.documentElement.classList.remove('dw-boot') }, 500)
            }, Math.max(0, 1600 - (Date.now() - start)))   // let the intro play at least once
          }
          window.__dwBootDone = hide
          setTimeout(hide, 9000)   // never get stuck on the loader
        } catch (e) {}
      })()
    </script>

    <style>
      #dw-boot { display: none; }
      .dw-boot body { overflow: hidden; }
      .dw-boot #dw-boot {
        position: fixed; inset: 0; z-index: 2147483000;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px;
        background: #050505; color: #fff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity .45s ease, transform .45s ease;
      }
      #dw-boot.dw-boot-out { opacity: 0; transform: scale(1.06); pointer-events: none; }
      #dw-boot .glow {
        position: absolute; width: 520px; height: 520px; max-width: 140vw; border-radius: 50%;
        background: radial-gradient(circle, rgba(229,9,20,.32), rgba(229,9,20,.08) 40%, transparent 68%);
        animation: dwBreathe 2.4s ease-in-out infinite;
      }
      #dw-boot .brand { position: relative; display: flex; align-items: flex-end; gap: 2px; }
      #dw-boot .mark {
        position: relative; height: 62px; width: auto;
        filter: drop-shadow(0 0 18px rgba(229,9,20,.55));
        animation: dwZoom .7s cubic-bezier(.2,.9,.25,1.15) both, dwPulse 2.4s ease-in-out 1s infinite;
      }
      #dw-boot .streak {
        position: absolute; left: -120px; top: 50%; width: 120px; height: 3px; margin-top: -6px; border-radius: 3px;
        background: linear-gradient(90deg, transparent, #e50914);
        animation: dwStreak .7s ease-out both;
      }
      #dw-boot .word {
        font-size: 44px; font-weight: 800; letter-spacing: -.02em; line-height: 1; transform: translateY(4px);
        clip-path: inset(0 100% 0 0); animation: dwWipe .6s cubic-bezier(.6,0,.2,1) .45s forwards;
      }
      #dw-boot .word b { color: #e50914; margin-left: .16em; text-shadow: 0 0 16px rgba(229,9,20,.45); }
      #dw-boot .bar {
        position: relative; width: 140px; height: 3px; overflow: hidden; border-radius: 3px;
        background: rgba(255,255,255,.08); opacity: 0; animation: dwFade .4s ease .9s forwards;
      }
      #dw-boot .bar::after {
        content: ''; position: absolute; inset: 0; width: 45%; border-radius: 3px;
        background: linear-gradient(90deg, transparent, #e50914, #ff4d57);
        animation: dwSlide 1.1s ease-in-out infinite;
      }
      @keyframes dwZoom { from { opacity: 0; transform: translateX(-60px) scale(.6); filter: blur(8px) } }
      @keyframes dwStreak { 0% { opacity: 0; transform: translateX(0) } 40% { opacity: 1 } 100% { opacity: 0; transform: translateX(140px) } }
      @keyframes dwWipe { to { clip-path: inset(-40px -40px -40px 0) } }
      @keyframes dwPulse { 50% { filter: drop-shadow(0 0 30px rgba(229,9,20,.9)); transform: scale(1.04) } }
      @keyframes dwBreathe { 50% { transform: scale(1.15); opacity: .7 } }
      @keyframes dwFade { to { opacity: 1 } }
      @keyframes dwSlide { from { transform: translateX(-110%) } to { transform: translateX(250%) } }
      .dw-ios-app #dw-boot .mark { animation: dwPulse 2.4s ease-in-out 1s infinite; }
      .dw-ios-app #dw-boot .streak { display: none; }
      @media (max-width: 380px) { #dw-boot .mark { height: 50px } #dw-boot .word { font-size: 36px } }
      @media (prefers-reduced-motion: reduce) { #dw-boot *, #dw-boot *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important } }
